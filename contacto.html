<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Dancing+Script:wght@400..700&family=Jura:wght@300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Contacto | Soul Booth</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header>
        <a href="index.html" aria-label="Volver al inicio de Soul Booth"> Soul Booth </a>
        <nav aria-label="Navegación de contacto">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html#Servicios">Servicios</a></li>
                <li><a href="contacto.html" aria-current="page">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main class="constacto-page">
        <section id="Contacto" aria-labelledby="titulo-contacto" class="contacto-contenedor">
            <h1 id="titulo-contacto">Contacto</h1>
            <p class="contacto-descripcion">
                Cuentanos que proyecto musical tienes en mente.
            </p>
            <form action="#" method="post">
                <div class="formulario-grupo">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="name" required>
                </div>
                <div class="formulario-grupo">
                    <label for="correo">Correo electronic:</label>
                    <input type="email" id="correo" name="correo" autocomplete="email" required>
                </div>
                <div class="formulario-grupo">
                    <label for="servicio">¿Qué servicio te interesa?</label>
                    <select name="servicio" id="servicio" required>
                        <option value="">Selecciona un servicio</option>
                        <option value="songwriting"><span lang="en">Songwriting</span></option>
                        <option value="edicion">Edición</option>
                        <option value="registro">Registro de obras</option>
                        <option value="direccion-vocal">Direccion vocal</option>
                        <option value="mezcla">Mezcla</option>
                        <option value="grabacion">Grabación de voces</option>
                    </select>
                </div>

                <div class="formulario-grupo">
                    <label for="mensaje" >Cuentanos sobre tu proyecto:</label>
                    <textarea name="mensaje" id="mensaje" rows="5" required></textarea>

                </div>

                <button type="submit" class="formulario-grupo">Enviar mensaje</button>
            </form>
        </section>
    </main>
    <footer>
        <p>Copyright &copy; 2026 Soul Booth</p>
        <a href="index.html" class="contacto-volver">Volver al inicio</a>
    </footer>
</body>
</html>
